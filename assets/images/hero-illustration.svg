<svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3B5FC4" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3B5FC4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3B5FC4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C4FA8" />
      <stop offset="55%" stop-color="#16255A" />
      <stop offset="100%" stop-color="#0A1330" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CDA0" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>
    <linearGradient id="cardGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDBB8C" />
      <stop offset="100%" stop-color="#B98F5C" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#050B1F" flood-opacity="0.35" />
    </filter>
    <filter id="cardShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#050B1F" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- ambient background glow -->
  <circle cx="262" cy="245" r="260" fill="url(#bgGlow)" />

  <!-- dashed orbit -->
  <circle cx="262" cy="245" r="196" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.4" stroke-dasharray="2 8" stroke-linecap="round" />

  <!-- sparkle dots -->
  <circle cx="80" cy="120" r="4" fill="#C5A880" opacity="0.85" />
  <circle cx="448" cy="150" r="3" fill="#fff" opacity="0.6" />
  <circle cx="420" cy="400" r="5" fill="#2C4FA8" opacity="0.5" />
  <circle cx="70" cy="380" r="3.5" fill="#C5A880" opacity="0.7" />
  <path d="M104 60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#C5A880" opacity="0.9" />
  <path d="M452 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fff" opacity="0.55" />

  <!-- circular panel behind NZ map -->
  <g filter="url(#softShadow)">
    <circle cx="262" cy="245" r="118" fill="url(#panelGrad)" />
    <circle cx="262" cy="245" r="118" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
    <ellipse cx="222" cy="195" rx="46" ry="30" fill="#fff" opacity="0.06" />
  </g>

  <!-- New Zealand silhouette (simplified North & South Island) -->
  <g transform="translate(262 245) rotate(18) translate(-30 -55)" filter="url(#cardShadow)">
    <!-- North Island -->
    <path d="M46 6 C58 2 66 10 64 22 C70 30 66 42 56 44 C60 54 52 64 42 62 C44 72 34 80 24 74 C14 78 4 70 8 58 C0 52 0 40 8 34 C4 24 12 12 24 14 C28 6 40 2 46 6 Z"
      fill="#E7EEF7" stroke="#C9D6E8" stroke-width="1" />
    <!-- Cook Strait gap -->
    <!-- South Island -->
    <path d="M22 86 C34 82 46 88 46 98 C56 100 60 112 52 120 C56 130 48 140 38 138 C40 148 30 156 20 150 C10 154 0 146 4 136 C-4 130 -2 118 8 114 C4 104 12 92 22 86 Z"
      fill="#E7EEF7" stroke="#C9D6E8" stroke-width="1" />
    <!-- Auckland pin -->
    <g transform="translate(38, 20)">
      <path d="M0 0 C7 0 12 5 12 12 C12 21 0 34 0 34 C0 34 -12 21 -12 12 C-12 5 -7 0 0 0 Z" fill="#C5A880" />
      <circle cx="0" cy="12" r="4.5" fill="#0C1938" />
    </g>
  </g>

  <!-- koru fern accent -->
  <g transform="translate(340, 300)" opacity="0.9">
    <path d="M0 30 C0 10 20 -8 40 0 C55 6 55 26 40 30 C30 33 22 26 26 18 C28 13 34 12 36 16"
      fill="none" stroke="#C5A880" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- connecting translate arrows -->
  <g stroke="#C5A880" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.85">
    <path d="M150 150 C 118 122, 108 96, 112 74" />
    <path d="M374 150 C 400 122, 408 96, 402 74" />
  </g>

  <!-- floating language card: English (source) -->
  <g filter="url(#cardShadow)" transform="translate(38, 26)">
    <rect x="0" y="0" width="120" height="76" rx="18" fill="#FFFFFF" />
    <path d="M22 76 L22 96 L46 76 Z" fill="#FFFFFF" />
    <text x="60" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#0C1938" text-anchor="middle">EN</text>
    <text x="60" y="64" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#8A97A6" text-anchor="middle">ENGLISH</text>
  </g>

  <!-- floating language card: Translated -->
  <g filter="url(#cardShadow)" transform="translate(362, 26)">
    <rect x="0" y="0" width="120" height="76" rx="18" fill="url(#cardGoldGrad)" />
    <path d="M98 76 L98 96 L74 76 Z" fill="url(#cardGoldGrad)" />
    <path d="M22 30 h34 M39 24 v10 M27 46 c3 -7 8 -12 8 -12 s5 5 8 12 M24 50 h30" stroke="#0C1938" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="64" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#0C1938" opacity="0.75" text-anchor="middle">TRANSLATED</text>
  </g>

  <!-- NZ badge under globe -->
  <g filter="url(#cardShadow)" transform="translate(212, 372)">
    <rect x="0" y="0" width="100" height="34" rx="17" fill="#FFFFFF" />
    <text x="50" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6" fill="#0C1938" text-anchor="middle">NEW ZEALAND</text>
  </g>

  <!-- certified badge -->
  <g filter="url(#cardShadow)" transform="translate(90, 388)">
    <circle cx="16" cy="16" r="16" fill="#FFFFFF" />
    <path d="M9 16 l4.5 4.5 10 -10" stroke="#1E8E3E" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
